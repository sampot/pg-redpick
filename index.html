<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="撿紅點：對點數撿牌、只算紅心方塊分數。純前端 Playgrounds SAM，適配手機與桌面、自製音效。"
    />
    <title>撿紅點</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <h1>撿紅點</h1>
        <p class="tagline">對點數撿牌 · 紅心方塊計分 · 純娛樂</p>
      </header>

      <section class="meter" aria-label="對局狀態">
        <div class="meter-item">
          <span class="label">回合</span>
          <strong id="turn-label">—</strong>
        </div>
        <div class="meter-item">
          <span class="label">牌庫</span>
          <strong id="stock-label">0</strong>
        </div>
        <div class="meter-item">
          <span class="label">你的紅點</span>
          <strong id="score-you">0</strong>
        </div>
        <div class="meter-actions">
          <button type="button" id="btn-mute" class="secondary" aria-pressed="true">
            音效開
          </button>
        </div>
      </section>

      <div class="controls">
        <button type="button" id="btn-deal">開局</button>
        <button type="button" id="btn-reset" class="secondary">重來</button>
      </div>

      <p id="status" class="status" role="status">點「開局」發牌。對到相同點數就能撿走。</p>

      <section class="scores" aria-label="分數板">
        <div class="score-chip" data-seat="0"><span>你</span><strong id="sc-0">0</strong></div>
        <div class="score-chip" data-seat="1"><span>小梅</span><strong id="sc-1">0</strong></div>
        <div class="score-chip" data-seat="2"><span>阿心</span><strong id="sc-2">0</strong></div>
        <div class="score-chip" data-seat="3"><span>黑哥</span><strong id="sc-3">0</strong></div>
      </section>

      <section class="table" aria-label="牌桌">
        <div class="seat seat-top" data-seat="2">
          <div class="seat-meta">
            <span class="seat-name">阿心</span>
            <span class="seat-count" id="count-2">0</span>
          </div>
          <div class="seat-cards" id="op-2" aria-hidden="true"></div>
        </div>

        <div class="seat-mid">
          <div class="seat seat-left" data-seat="1">
            <div class="seat-meta">
              <span class="seat-name">小梅</span>
              <span class="seat-count" id="count-1">0</span>
            </div>
            <div class="seat-cards" id="op-1" aria-hidden="true"></div>
          </div>

          <div class="table-area">
            <p class="table-label">桌上</p>
            <div id="table-cards" class="table-cards" role="list" aria-label="桌上的牌"></div>
          </div>

          <div class="seat seat-right" data-seat="3">
            <div class="seat-meta">
              <span class="seat-name">黑哥</span>
              <span class="seat-count" id="count-3">0</span>
            </div>
            <div class="seat-cards" id="op-3" aria-hidden="true"></div>
          </div>
        </div>

        <div class="seat seat-you" data-seat="0">
          <div class="seat-meta">
            <span class="seat-name">你</span>
            <span class="seat-count" id="count-0">0</span>
          </div>
          <div id="hand" class="hand" role="listbox" aria-label="你的手牌"></div>
        </div>
      </section>

      <div class="action-bar">
        <button type="button" id="btn-play" class="primary" disabled>出牌撿點</button>
        <button type="button" id="btn-clear" class="secondary" disabled>取消選取</button>
      </div>

      <details class="rules">
        <summary>規則摘要</summary>
        <ul>
          <li>四人各 5 張，桌上 4 張；出一張後若牌庫還有則補一張。</li>
          <li>出手牌若與桌上<strong>點數相同</strong>，該點數桌上全部連同出手牌一起收進自己的牌堆。</li>
          <li>對不到就放在桌上。牌庫與手牌都空後結算。</li>
          <li>只計<strong>紅心／方塊</strong>：A＝20；10／J／Q／K＝10；2–9＝點數；黑桃梅花＝0。</li>
          <li>剩餘桌牌歸最後一次成功撿牌者。紅點最高者勝。</li>
        </ul>
      </details>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
